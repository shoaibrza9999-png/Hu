databases:
  - name: amazon-tracker-db
    databaseName: tracker
    user: tracker_user
    plan: free

services:
  - type: web
    name: amazon-tracker-web
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn 'app:create_app()'"
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: amazon-tracker-db
          property: connectionString
      - key: SCRAPER_API_KEY
        sync: false
      - key: CRON_SECRET
        generateValue: true
