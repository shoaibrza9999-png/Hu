databases:
  - name: amazon-tracker-db
    databaseName: tracker
    user: tracker_user
    plan: free

services:
  - type: web
    name: amazon-tracker-web
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn 'app:create_app()'"
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: amazon-tracker-db
          property: connectionString
      - key: SCRAPER_API_KEY
        sync: false

  - type: cron
    name: amazon-tracker-cron
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "flask --app app run-tracker"
    schedule: "0 * * * *" # Runs every hour
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: amazon-tracker-db
          property: connectionString
      - key: SCRAPER_API_KEY
        sync: false
